# en50716-consolidated execution) against the Basic Integrity ruleset
# tools/pmd/kura-java-ruleset.xml: 640 violations in 249 classes.
# Format: <fully-qualified class>=<comma-separated rule names>. The class name
# is the one PMD reports, so a nested class carries its own entry.
#
