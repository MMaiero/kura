# also filters the report:
#   mvn pmd:aggregate-pmd-check@en50716-consolidated -pl '!distrib,!distrib/aarch64-core,!distrib/x86_64-core' -Dkura.pmd.baseline= -Dkura.pmd.failOnViolation=false
# then key each violation in target/pmd.xml as <package>.<class>.
#
